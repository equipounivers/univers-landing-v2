# Netlify configuration for Univers landing
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets aggressively
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Trailing slash handling — remove for cleaner URLs
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false

# Security.txt (responsible disclosure)
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/seguridad.html"
  status = 301
